# Not a distributable package. The module ships as source and run.sh installs
# requirements.txt into the interpreter it selects, so requirements.txt is the
# dependency source of truth and requirements-dev.txt pins the toolchain.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: needs Isaac Sim + GPU"]
addopts = "-m 'not gpu'"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "BLE", "RUF", "LOG", "G"]

[tool.ruff.lint.per-file-ignores]
# the script re-exports pickcell symbols under its own name so the frozen
# tests/test_pick_red_block.py regression suite keeps importing them
"examples/pick_red_block.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tools", "examples"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["isaacsim.*", "omni.*", "carb.*", "pxr.*", "viam.*", "grpclib.*", "PIL.*"]
ignore_missing_imports = true
