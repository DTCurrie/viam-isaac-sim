# see https://github.com/viamrobotics/build-action for help
on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # secrets.viam_key_id / secrets.viam_key_value must be an API key from
      # the viam-dev org with module-write permission. The registry entry is
      # created once with: viam module create --name isaac-sim-devin --public-namespace viam
      - uses: viamrobotics/build-action@v1
        with:
          # note: you can replace this line with 'version: ""' if
          # you want to test the build process without deploying
          version: ${{ github.ref_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
          token: ${{ github.token }} # only required for private git repos
