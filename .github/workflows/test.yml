on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: make fmt-check PY=python
      - run: make lint PY=python
      - run: make typecheck PY=python
      - run: make test PY=python
      - run: make module.tar.gz && tar tzf module.tar.gz
